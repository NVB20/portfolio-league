# CI: on every push to main (a merged PR is a push to main), type check and test the API against a
# throwaway Postgres, type check the app, then build the API image, scan it with Trivy and publish it to GHCR.
# Pull requests into main run the checks and the image scan; nothing is published from a PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Type check and test the API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hof
          POSTGRES_PASSWORD: hof_dev
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hof -d portfolio_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # Every test file reads this, so they all share the one service database (they run one after another).
      TEST_DATABASE_URL: postgres://hof:hof_dev@localhost:5432/portfolio_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The same esbuild bundle the Docker image runs, so a broken build fails the PR, not the merge.
      - run: npm run build
      - run: npm test
      # Known vulnerabilities in what the server ships (dev tools excluded). High or critical fails.
      - run: npm audit --omit=dev --audit-level=high

  app:
    name: Check and build the app
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Bundle the web app the way Hosting gets it: catches Metro errors tsc can't see (bad imports,
      # missing .web files). No EXPO_PUBLIC_* values are needed just to bundle.
      - run: npx expo export --platform web
      # Critical only: firebase pulls in @grpc/grpc-js (high, Node-only, never loaded in the browser) and
      # npm's only "fix" is downgrading firebase to v9. Revisit when firebase updates it.
      - run: npm audit --omit=dev --audit-level=critical

  # Runs on PRs too, so an image with a known vulnerability fails the PR, not the merge. Only a push to main
  # logs in and publishes.
  image:
    name: Build, scan and publish the API image
    needs: [test, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # ghcr.io/<owner>/<repo>-api, lowercased. Tags: latest and the short commit sha.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build into the runner's Docker, so Trivy scans exactly the image that would be published.
      - uses: docker/build-push-action@v7
        with:
          context: api
          load: true
          tags: hof-api:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Known vulnerabilities in the image: Alpine's packages and every npm package inside it. A high or critical
      # one that already has a fix fails the run, and nothing is published. Pinned to a commit and a Trivy
      # version, not a tag: this action's tags were hijacked in March 2026 (GHSA-69fq-xp46-6x23).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hof-api:scan
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again, now pushed. Every layer comes from the build above, so nothing is rebuilt.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
